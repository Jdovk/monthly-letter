<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Places We Leave the Light On</title><style>
:root{--bg:#0b1020;--fg:#f2e9e5;--muted:#b8b4c8;--accent:#f2b8c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 Georgia,serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 70% 20%,#3d3557 0,transparent 45%),linear-gradient(#0b1020,#141a30);z-index:-2}.rain{position:fixed;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(105deg,transparent 0 45px,#c4d5ff55 46px,transparent 47px 95px);animation:rain 13s linear infinite;z-index:-1}@keyframes rain{to{transform:translateX(-95px)}}main{max-width:760px;margin:auto;padding:7vh 24px 80px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}.kicker{font:12px/1.4 system-ui;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(34px,7vw,64px);font-weight:400;line-height:1.14;margin:18px 0 25px}#scene{min-height:260px;animation:appear .9s ease}p{margin:0 0 1.25em}.dialogue{border-left:2px solid var(--accent);padding:0 0 0 20px;color:#fff}.muted{color:var(--muted)}button{font:14px system-ui;letter-spacing:.05em;background:transparent;border:1px solid #a9a2b6;color:white;border-radius:30px;padding:14px 25px;cursor:pointer;transition:.25s}button:hover{background:#ffffff19;border-color:white}#controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:32px}.progress{font:12px system-ui;color:var(--muted)}@keyframes appear{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.heart{font-size:45px;color:var(--accent);animation:pulse 3s infinite}@keyframes pulse{50%{opacity:.45;transform:scale(.9)}}.letter{background:#f6ece6;color:#342d36;padding:clamp(24px,6vw,52px);border-radius:3px;box-shadow:0 20px 80px #0007;line-height:1.9}.letter h2{font-weight:400;font-size:32px}.letter .signature{margin-top:35px;font-style:italic}.small{font:12px system-ui;color:var(--muted);margin-top:25px}.letter .small{color:#786e76}#sound{position:fixed;top:14px;right:16px;font:12px system-ui;opacity:.8}body.letter-mode{background:#181324}body.letter-mode:before{background:radial-gradient(circle at 50% 20%,#5e3e53,#171321 75%)}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
</style></head><body><div class="rain"></div><button id="sound" onclick="toggleSound()">♪ Sound off</button><main><div id="scene"></div><div id="controls"><span class="progress" id="progress"></span><button id="next" onclick="advance()">Begin →</button></div></main><script>
const scenes=[
{tag:"A story for you",title:"The Places We Leave the Light On",body:`<p class="muted">Some people arrive like thunder. Others arrive like a message at 2:13 a.m.</p><p>For the girl who taught a boy that even a small light can make a long night feel shorter.</p>`,button:"Open the story →"},
{tag:"Chapter 1 · 2:13 a.m.",title:"An accidental hello",body:`<p>Mara meant to send a photograph of the rain to her friend. Instead, she sent it to a stranger named Eli.</p><p class="dialogue">Mara: Sorry. Wrong person.<br>Eli: No, it's okay. It looks like it's raining where you are.<br>Mara: Very observant.<br>Eli: I'm known for it.</p><p>She laughed at a phone screen. He smiled at a name he had never heard before.</p><p>Neither deleted the conversation.</p>`},
{tag:"Chapter 2 · A habit",title:"The light in the window",body:`<p>They lived in different cities, where the rain fell at different hours. At first they traded songs. Then bad jokes. Then the stories they usually kept to themselves.</p><p>Mara started leaving a small lamp on beside her window whenever they called.</p><p class="dialogue">Eli: Why that lamp?<br>Mara: So you know I'm here.<br>Eli: I can't even see your street.<br>Mara: You can see me.</p><p>And he could. Through a screen no bigger than his hand, he began to know her better than anyone he'd met in person.</p>`},
{tag:"Chapter 3 · Ordinary days",title:"A thousand little almosts",body:`<p>They made plans for a someday: a train ride, a tiny café, two drinks on the same table instead of two cameras facing separate rooms.</p><p>But real life kept arriving. Exams. Family. Work. Days when Eli was tired and forgot to ask about hers. Days when Mara wished she didn't have to ask him to make time.</p><p class="dialogue">Mara: Sometimes I feel like I'm the only one waiting for someday.<br>Eli: That's not true.<br>Mara: I know you mean that. I just wish I could feel it.</p><p>He wanted to say the right thing. Instead, he went quiet. Silence, to him, meant he was thinking. To her, it sounded like an answer.</p>`},
{tag:"Chapter 4 · The last call",title:"When the signal disappeared",body:`<p>One evening, after a difficult conversation, they agreed to give each other space. No dramatic farewell. No promises about when they'd speak again.</p><p>For a while, Mara still switched on the lamp. Eli still opened their conversation and stared at the empty typing box.</p><p>Then the lamp went dark. The messages stopped. Their lives kept moving, as lives do, even when the people inside them are not ready.</p><p>Neither knew whether they'd lost a person or only the road back to them.</p>`},
{tag:"Chapter 5 · Much later",title:"A seat by the window",body:`<p>Months passed. Eli learned to make plans instead of only dreaming about them. He learned that care had to travel farther than his intentions.</p><p>One afternoon, delayed by a storm, he stepped into a small café near a train station. There were no empty tables except a chair across from a woman sketching rain on a napkin.</p><p class="dialogue">Eli: Sorry, is this seat taken?<br>Woman: No, go ahead.</p><p>He set down his cup. On the napkin was a little window with a lamp inside.</p><p>He looked up.</p>`},
{tag:"Chapter 6 · Recognition",title:"The same rain",body:`<p class="dialogue">Eli: You're still drawing the weather.<br>Mara: You're still making obvious observations.</p><p>They laughed, and then neither spoke for a moment.</p><p>The meeting didn't erase what had hurt. They were older now, a little braver, and neither wanted to pretend that missing someone was the same as knowing how to love them well.</p><p class="dialogue">Eli: Would you like to have coffee with me? Properly. I can plan it.<br>Mara: You already found the café.<br>Eli: Pure accident. The next one won't be.</p><p>Outside, the rain softened.</p>`},
{tag:"Epilogue",title:"Not the ending they expected",body:`<p>They did not promise forever across that table.</p><p>They promised something smaller and harder: to speak when it mattered, to listen when it was uncomfortable, and to make room for one another in the ordinary days.</p><p>And that evening, when Mara returned home, she switched on her lamp.</p><p>Not because she was waiting to be found.</p><p>Because someone had finally learned to meet her halfway.</p>`},
{tag:"The final page",title:"The story is over.",body:`<p>Everything before this was fiction.</p><p>But there's something real I've wanted to say.</p><p class="muted">There is a letter tucked behind this last page. It isn't from Eli to Mara. It's from me to you.</p><div class="heart">♡</div>`,button:"Open my letter ♡"}
];
let index=-1, audio=null, sound=false;
function advance(){index++;if(index<scenes.length){let s=scenes[index];document.body.classList.remove('letter-mode');document.querySelector('.rain').style.display='';document.getElementById('scene').innerHTML=`<div class="kicker">${s.tag}</div><h1>${s.title}</h1><div>${s.body}</div>`;document.getElementById('scene').style.animation='none';void document.getElementById('scene').offsetWidth;document.getElementById('scene').style.animation='appear .9s ease';document.getElementById('progress').textContent=`${index+1} / ${scenes.length}`;document.getElementById('next').textContent=s.button||'Continue →';}else{showLetter()}window.scrollTo({top:0,behavior:'smooth'})}
function showLetter(){document.body.classList.add('letter-mode');document.querySelector('.rain').style.display='none';document.getElementById('scene').innerHTML=`<div class="kicker">Outside the story · A real letter</div><h1>For you, My Princess.</h1><article class="letter"><h2>Happy 11 months. ♡</h2><p>Love, this part isn't about two fictional people. It's about you and me.</p><p>I wanted to make you something that took thought, time, and care. (I might have been working for this since the 10th monthsary, hehe) I know I haven't always been good at taking the initiative or making plans for us. I understand that loving you isn't only about what I feel; it's also about making sure you can feel that love in the things I do.</p><p>I'm sorry for the times my silence made you feel alone, or my lack of planning made you wonder whether our relationship matters to me. It does. You do.</p><p>Even with the distance between us, I want to make memories with you intentionally. I want to ask, listen, plan, and follow through—not just today, but in our ordinary days too. I want to make more our days more special. So i will be making a letter with a bit of a twist in it.</p><p>Thank you for these eleven months: for the laughter, the conversations, the little moments that have become precious to me, and for being yourself. I know a story can't fix an argument, and a letter can't replace action. But I hope this is a beginning you can see.</p><p>I don't know every chapter ahead of us. I do know that I want to keep showing up, learning, and choosing you.</p><p>Happy anniversary, love. I love you.</p><p class="signature">— Moon/Meego ♡</p><p class="small">P.S. I made this on my phone using my notepad but decided to continue it when my brand new laptop  arrived :3</p></article>`;document.getElementById('progress').textContent='11 months · our story continues';document.getElementById('next').textContent='Read again ↺';document.getElementById('next').onclick=()=>{index=-1;document.getElementById('next').onclick=advance;advance()};}
function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'♪ Sound on':'♪ Sound off';if(sound){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume();playTone()} }
function playTone(){if(!sound||!audio)return;let now=audio.currentTime;[261.63,329.63,392,523.25].forEach((freq,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,now+i*.28);g.gain.linearRampToValueAtTime(.018,now+i*.28+.08);g.gain.exponentialRampToValueAtTime(.0001,now+i*.28+1.9);o.connect(g);g.connect(audio.destination);o.start(now+i*.28);o.stop(now+i*.28+2)})}
advance();</script></body></html>

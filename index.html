<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101426">
<title>Moon & Lune — A Year Written in Starlight</title>
<style>
:root{--ink:#f7f0f5;--muted:#c9bfd0;--gold:#f5d99b;--rose:#e8b9d0;--night:#0b1020;--panel:#151a2dcc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--night);color:var(--ink);font:17px/1.8 Georgia,serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 10%,#39405f 0,transparent 55%),linear-gradient(160deg,#0a1020,#171326 60%,#0b1020)}
#backdrop{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:.27;transition:background-image .7s ease,opacity .7s ease}
#backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#090d1bdc,#090d1b55 50%,#090d1bdc),linear-gradient(0deg,#0b1020 0,transparent 65%)}
main{width:min(850px,100%);margin:auto;padding:9vh 24px 110px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.kicker{font:11px/1.5 system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(38px,7vw,76px);font-weight:400;line-height:1.08;margin:16px 0 24px;text-shadow:0 5px 35px #0008}
#scene{animation:rise .8s ease;min-height:300px}.copy{max-width:720px;color:#f1eaf1}.copy p{margin:0 0 1.25em}.dialogue{border-left:2px solid var(--rose);padding-left:19px;color:#fff}.muted{color:var(--muted)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:32px}
button{font:13px system-ui,sans-serif;letter-spacing:.06em;color:white;background:#ffffff10;border:1px solid #d9c8dd88;border-radius:30px;padding:13px 23px;cursor:pointer;transition:.2s}
button:hover{background:#ffffff24;border-color:var(--gold)}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#next{background:#f2d9b9;color:#211a2b;border-color:transparent;font-weight:600}
.progress{font:12px system-ui,sans-serif;color:var(--muted)}
#music{position:fixed;z-index:5;right:14px;bottom:14px;width:min(330px,calc(100% - 28px));background:#101426ed;border:1px solid #ffffff2b;border-radius:18px;padding:13px 15px;box-shadow:0 10px 40px #0008;font:12px/1.5 system-ui,sans-serif;backdrop-filter:blur(12px)}
.music-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;color:#fff}.music-head strong{letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--gold)}
.music-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.music-controls button{padding:6px 11px;font-size:11px}.music-controls input[type=range]{width:90px;accent-color:var(--rose)}
#spotifyUrl{width:100%;margin-top:9px;background:#ffffff0c;border:1px solid #ffffff30;border-radius:8px;padding:8px;color:white;font:11px system-ui}
#spotifyFrame{width:100%;height:80px;border:0;border-radius:10px;margin-top:8px;display:none}
#fileInput{display:none}.hint{font-size:10px;color:#bdb4c5;margin-top:6px}
.letter-wrap{background:#f6eee8;color:#362b39;padding:clamp(25px,6vw,58px);border-radius:4px;box-shadow:0 24px 90px #0009;line-height:1.9}
.letter-wrap h2{font-size:clamp(27px,4vw,38px);font-weight:400;margin:0 0 25px;color:#684a60}
.letter-wrap p{margin:0 0 1.25em}.letter-wrap .sign{margin-top:32px;font-style:italic}.letter-wrap .ps{font:12px/1.6 system-ui;color:#81747e;margin-top:30px}
.heart{font-size:48px;color:#d68cae;margin:20px 0;animation:pulse 3s infinite}
body.letter-mode #backdrop{opacity:.1}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.5;transform:scale(.92)}}
@media(max-width:600px){main{padding-top:7vh;padding-bottom:170px}#scene{min-height:250px}#music{bottom:8px;right:8px;width:calc(100% - 16px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="backdrop" aria-hidden="true"></div>
<main>
 <section id="scene" aria-live="polite"></section>
 <div class="actions"><span class="progress" id="progress"></span><button id="next" type="button">Begin our story →</button></div>
</main>
<aside id="music" aria-label="Music player">
 <div class="music-head"><strong>Our little soundtrack</strong><span id="volumeLabel">20% volume</span></div>
 <div class="music-controls">
  <button type="button" id="playBtn">Play music</button>
  <button type="button" id="uploadBtn">Upload song</button>
  <label for="volume" class="hint">Volume</label><input id="volume" type="range" min="0" max="1" step=".01" value=".2">
 </div>
 <input id="fileInput" type="file" accept="audio/*">
 <input id="spotifyUrl" type="url" placeholder="Paste a Spotify playlist / track link, then press Enter" aria-label="Spotify link">
 <iframe id="spotifyFrame" title="Spotify player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
 <div class="hint">Local uploads play only on your device. Spotify has its own volume control.</div>
 <audio id="audio" loop></audio>
</aside>
<script>
const scenes=[
 {tag:"For my Lune · One year",title:"A Year Written in Starlight",image:"https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=1800&q=85",body:`<p class="muted">Somewhere between two distant skies, a little light kept finding its way home.</p><p>This is a story about Moon and Lune: two souls from different corners of the same enchanted world, and the strange, beautiful magic of choosing each other.</p><p>For you, my love. Happy first anniversary. ♡</p>`,button:"Turn the first page →"},
 {tag:"Chapter I · The Astral Academy",title:"The boy who followed the moon",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1800&q=85",body:`<p>Moon was an apprentice mage who spent his evenings mapping constellations. He knew the names of a thousand stars, but none of them had ever made him feel less alone.</p><p>Then, one night, a message appeared in the margin of his spellbook. It was written in silver ink, signed by a girl named Lune.</p><p class="dialogue">Lune: You drew the northern sky upside down.<br>Moon: I was testing whether the stars would notice.<br>Lune: And did they?<br>Moon: One did. Apparently, she's quite observant.</p><p>That was how their little universe began: with a correction, a laugh, and a conversation neither wanted to end.</p>`},
 {tag:"Chapter II · The Starlit Forest",title:"A thousand little constellations",image:"https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1800&q=85",body:`<p>They began meeting in a forest that existed between worlds. Fireflies drifted like tiny lanterns, and the trees remembered every promise spoken beneath their branches.</p><p>They traded stories, songs, silly jokes, and the small details that made up their days. Lune taught Moon that magic did not always arrive as a grand spell. Sometimes it was simply staying a little longer.</p><p class="dialogue">Moon: If I could, I'd make a portal so we wouldn't have to say goodnight from opposite sides of the sky.<br>Lune: Then make one someday.<br>Moon: I will. But until then, I'll keep finding my way back here.</p><p>And so the forest became their place: a little world built from ordinary moments that somehow felt enchanted.</p>`},
 {tag:"Chapter III · The Glass Sea",title:"When distance became a spell",image:"https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1800&q=85",body:`<p>But even magic had limits. The sea between their kingdoms grew wider. Some days the messages arrived late; some nights the stars were hidden by clouds. They missed chances, misunderstood silences, and learned that love could be real while still needing care.</p><p>Moon sometimes thought that meaning well was enough. Lune needed him to understand that promises had to become actions: a plan made, a question asked, a little time protected for them.</p><p class="dialogue">Lune: I don't need every day to be perfect. I just want to feel that we're building something together.<br>Moon: I hear you. I don't want you carrying that hope alone.</p><p>He could not command the sea to disappear. He could learn to cross it, one deliberate step at a time.</p>`},
 {tag:"Chapter IV · The Lost Kingdom",title:"The night the stars went quiet",image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1800&q=85",body:`<p>A dark enchantment swept across the forest. Their paths split, their familiar meeting place faded, and for a while neither could find the other among the endless roads.</p><p>Moon kept the old map folded close. Lune carried a small star in a glass charm. They each wondered whether the other still remembered the way.</p><p>Time passed. They grew. They learned that missing someone was not the same as knowing how to love them well. And still, somewhere beneath all the distance, the little light remained.</p>`},
 {tag:"Chapter V · The Lantern Festival",title:"Two paths, one light",image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=85",body:`<p>At the edge of a quiet town, a festival filled the evening sky with floating lanterns. Moon had come to leave a wish among them. Lune had come carrying the star in her glass charm.</p><p>They saw each other across the crowd. No spell brought them together. No prophecy demanded it. They simply took a step, then another, until the distance was only a few feet.</p><p class="dialogue">Moon: I kept thinking I'd recognize you anywhere.<br>Lune: And?<br>Moon: I was right. Even with a thousand lanterns in the sky, I'd know your light.</p><p>They did not pretend the hard parts had never happened. They chose to meet each other honestly, and to make the next chapter with more than wishes.</p>`},
 {tag:"Epilogue · The road ahead",title:"A future we get to write",image:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=85",body:`<p>Their story did not end at the festival. There were still new spells to learn, new places to visit, and ordinary days waiting to be made special.</p><p>Somewhere ahead was a road beneath a gold-pink sunset. Two helmets rested side by side. There would be games to play, victories to celebrate, plans to make, and quiet moments when simply being together was enough.</p><p>They could not see every detail of the future. But they could keep choosing the direction together.</p><div class="heart">♡</div><p class="muted">And now, my Lune, the story gives way to something real.</p>`,button:"Read the letter I wrote for you ♡"},
 {tag:"The final page · From Moon to Lune",title:"My letter to you",image:"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1800&q=85",letter:true}
];
let index=0;
const scene=document.getElementById("scene"),next=document.getElementById("next"),progress=document.getElementById("progress"),backdrop=document.getElementById("backdrop");
function render(){const s=scenes[index];document.body.classList.toggle("letter-mode",!!s.letter);backdrop.style.backgroundImage="url('"+s.image+"')";scene.style.animation="none";void scene.offsetWidth;scene.style.animation="rise .8s ease";
 if(s.letter){scene.innerHTML=`<div class="kicker">${s.tag}</div><h1>${s.title}</h1><article class="letter-wrap"><h2>To my Lune, happy one year. ♡</h2><p>My love,</p><p>One whole year. I still find it a little unreal that someone who started as a name on a screen became such an important part of my life. Even with all the distance between us, you've given me so many moments I want to keep: the laughter, the late conversations, the little updates about our days, and all the times you made an ordinary moment feel special.</p><p>I know I haven't always been the best at showing you how much you mean to me. There have been times I didn't take the initiative, didn't make plans, or let silence do the talking when I should have reached for you. I'm sorry for those moments. I don't want you to have to keep wondering whether I care. I want to show it more clearly, through the way I listen, the effort I make, and the promises I actually follow through on.</p><p>I want to do the things we've talked about and the things you've wanted us to experience together. I want us to play Valorant, celebrate our wins (and laugh at our questionable aim), and work toward the goals we dream about. I want to make memories outside a screen too: the motorcycle rides we've imagined, stopping somewhere to watch the sunset, and all those simple dates that become special just because we're there together.</p><p>I can't promise that every day will be easy or that I'll never make mistakes. I can promise that I want to keep learning how to love you better, keep making room for us, and keep choosing you with intention. I want to build a future where you don't just hear that you're important to me—you feel it in the way I show up.</p><p>Thank you for being my Lune, for sharing this year with me, and for giving me a place in your world. Whatever chapters are waiting for us, I hope we get to write them side by side.</p><p>Happy first anniversary, my love. I love you. Here's to our next chapter, and all the little adventures in between.</p><p class="sign">Always yours,<br>Moon ♡</p><p class="ps">P.S. This little world is something I want to keep updating for every monthsary and anniversary. So this isn't the last page—just the first page of the next year.</p></article>`;next.textContent="Read our story again ↺";next.onclick=()=>{index=0;render();};}
 else{scene.innerHTML=`<div class="kicker">${s.tag}</div><h1>${s.title}</h1><div class="copy">${s.body}</div>`;next.textContent=s.button||"Continue →";next.onclick=advance;}
 progress.textContent=(index+1)+" / "+scenes.length;window.scrollTo({top:0,behavior:"smooth"});}
function advance(){if(index<scenes.length-1){index++;render();}}
next.addEventListener("click",()=>{});
render();
const audio=document.getElementById("audio"),volume=document.getElementById("volume"),volumeLabel=document.getElementById("volumeLabel"),playBtn=document.getElementById("playBtn"),fileInput=document.getElementById("fileInput"),spotifyUrl=document.getElementById("spotifyUrl"),spotifyFrame=document.getElementById("spotifyFrame");
audio.src="assets/music/background.mp3";audio.volume=.2;
function updateVolume(){audio.volume=Number(volume.value);volumeLabel.textContent=Math.round(audio.volume*100)+"% volume";}
volume.addEventListener("input",updateVolume);
playBtn.addEventListener("click",async()=>{if(!audio.src){playBtn.textContent="Add background.mp3 to assets/music";return;}if(audio.paused){try{await audio.play();playBtn.textContent="Pause music";}catch(e){playBtn.textContent="Tap to play";}}else{audio.pause();playBtn.textContent="Play music";}});
document.getElementById("uploadBtn").addEventListener("click",()=>fileInput.click());
fileInput.addEventListener("change",()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;if(audio.dataset.objectUrl)URL.revokeObjectURL(audio.dataset.objectUrl);const url=URL.createObjectURL(file);audio.dataset.objectUrl=url;audio.src=url;audio.play().then(()=>playBtn.textContent="Pause music").catch(()=>playBtn.textContent="Play music");});
function spotifyEmbed(raw){try{const u=new URL(raw.trim());if(u.hostname!=="open.spotify.com")return null;const parts=u.pathname.split("/").filter(Boolean);if(parts.length<2)return null;return "https://open.spotify.com/embed/"+parts[0]+"/"+parts[1]+"?utm_source=generator";}catch(e){return null;}}
spotifyUrl.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const embed=spotifyEmbed(spotifyUrl.value);if(!embed){spotifyUrl.setCustomValidity("Paste a valid open.spotify.com playlist, album, track, artist, show, or episode link.");spotifyUrl.reportValidity();return;}spotifyUrl.setCustomValidity("");spotifyFrame.src=embed;spotifyFrame.style.display="block";});
</script>
</body>
</html>
